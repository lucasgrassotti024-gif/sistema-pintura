<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bucketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="paintEmerald" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="handleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#10b981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Alça do balde -->
  <path d="M 15 26 C 15 10, 49 10, 49 26" fill="none" stroke="url(#handleMetal)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Pega central da alça -->
  <path d="M 28 11.5 L 36 11.5" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Corpo do balde (trapezóide) -->
  <path d="M 12 24 L 17 55 C 17.5 58, 46.5 58, 47 55 L 52 24 Z" fill="url(#bucketBody)" stroke="#475569" stroke-width="1.5"/>

  <!-- Aro / Borda superior -->
  <ellipse cx="32" cy="24" rx="20" ry="5.5" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>

  <!-- Superfície da Tinta dentro do balde com brilho esmeralda -->
  <ellipse cx="32" cy="24" rx="18" ry="4.5" fill="url(#paintEmerald)" filter="url(#glow)"/>

  <!-- Gotas / Escorrido de tinta esmeralda na frente do balde -->
  <path d="M 24 26 C 24 33, 26 35, 27 35 C 28 35, 29 32, 29 27" fill="url(#paintEmerald)" opacity="0.95"/>
  <path d="M 33 27 C 33 39, 36 41, 37.5 41 C 39 41, 40 37, 40 26.5" fill="url(#paintEmerald)" opacity="0.95"/>

  <!-- Detalhes reflexos de luz no balde -->
  <path d="M 17 28 L 20.5 52" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Pinos de fixação da alça nas laterais -->
  <circle cx="12" cy="25" r="2.2" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <circle cx="52" cy="25" r="2.2" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
</svg>
